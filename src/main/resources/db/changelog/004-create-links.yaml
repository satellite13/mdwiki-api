databaseChangeLog:
  - changeSet:
      id: 004-create-links
      author: mdwiki
      changes:
        - createTable:
            tableName: links
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: source_page_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_links_source
                    references: pages(id)
                    deleteCascade: true
              - column:
                  name: target_page_id
                  type: uuid
                  constraints:
                    foreignKeyName: fk_links_target
                    references: pages(id)
              - column:
                  name: target_slug
                  type: varchar(500)
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_links_target_slug
            tableName: links
            columns:
              - column:
                  name: target_slug
        - createIndex:
            indexName: idx_links_source_page
            tableName: links
            columns:
              - column:
                  name: source_page_id
