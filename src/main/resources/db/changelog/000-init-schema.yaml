databaseChangeLog:
  - changeSet:
      id: 000-init-schema
      author: mdwiki
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE EXTENSION IF NOT EXISTS vector;

              -- users
              CREATE TABLE users (
                id          uuid DEFAULT gen_random_uuid() PRIMARY KEY,
                username    varchar(100) NOT NULL UNIQUE,
                email       varchar(255) NOT NULL UNIQUE,
                password_hash varchar(255) NOT NULL,
                role        varchar(20) NOT NULL DEFAULT 'READER',
                created_at  timestamptz NOT NULL DEFAULT now(),
                updated_at  timestamptz NOT NULL DEFAULT now()
              );

              -- pages
              CREATE TABLE pages (
                id              uuid DEFAULT gen_random_uuid() PRIMARY KEY,
                slug            varchar(500) NOT NULL UNIQUE,
                title           varchar(500) NOT NULL,
                content_md      text,
                content_html    text,
                file_path       varchar(1000),
                created_by      uuid REFERENCES users(id) ON DELETE SET NULL,
                updated_by      uuid REFERENCES users(id) ON DELETE SET NULL,
                created_at      timestamptz NOT NULL DEFAULT now(),
                updated_at      timestamptz NOT NULL DEFAULT now(),
                content_tsv     tsvector GENERATED ALWAYS AS (to_tsvector('russian', coalesce(title, '') || ' ' || coalesce(content_md, ''))) STORED,
                frontmatter_meta jsonb,
                deleted_at      timestamptz,
                folder_id       uuid
              );
              CREATE INDEX idx_pages_content_tsv ON pages USING GIN (content_tsv);
              CREATE INDEX idx_pages_frontmatter_meta_gin ON pages USING GIN (frontmatter_meta);

              -- tags
              CREATE TABLE tags (
                id   uuid DEFAULT gen_random_uuid() PRIMARY KEY,
                name varchar(200) NOT NULL UNIQUE
              );

              -- page_tags
              CREATE TABLE page_tags (
                page_id uuid NOT NULL REFERENCES pages(id) ON DELETE CASCADE,
                tag_id  uuid NOT NULL REFERENCES tags(id) ON DELETE CASCADE,
                PRIMARY KEY (page_id, tag_id)
              );

              -- links
              CREATE TABLE links (
                id              uuid DEFAULT gen_random_uuid() PRIMARY KEY,
                source_page_id  uuid NOT NULL REFERENCES pages(id) ON DELETE CASCADE,
                target_page_id  uuid REFERENCES pages(id),
                target_slug     varchar(500) NOT NULL
              );
              CREATE INDEX idx_links_target_slug ON links (target_slug);
              CREATE INDEX idx_links_source_page ON links (source_page_id);

              -- page_chunks
              CREATE TABLE page_chunks (
                id              uuid DEFAULT gen_random_uuid() PRIMARY KEY,
                page_id         uuid NOT NULL REFERENCES pages(id) ON DELETE CASCADE,
                chunk_index     int NOT NULL,
                chunk_text      text NOT NULL,
                section_heading varchar(500),
                embedding       vector(${embeddingDim})
              );
              CREATE INDEX idx_page_chunks_page_id ON page_chunks (page_id);
              CREATE INDEX idx_page_chunks_embedding ON page_chunks USING hnsw (embedding vector_cosine_ops);

              -- api_keys
              CREATE TABLE api_keys (
                id            uuid DEFAULT gen_random_uuid() PRIMARY KEY,
                user_id       uuid NOT NULL REFERENCES users(id) ON DELETE CASCADE,
                name          varchar(255) NOT NULL,
                key_hash      varchar(64) NOT NULL UNIQUE,
                last_used_at  timestamptz,
                created_at    timestamptz NOT NULL DEFAULT now(),
                expires_at    timestamptz
              );
              CREATE INDEX idx_api_keys_key_hash ON api_keys (key_hash);
              CREATE INDEX idx_api_keys_user_id ON api_keys (user_id);

              -- folders
              CREATE TABLE folders (
                id          uuid DEFAULT gen_random_uuid() PRIMARY KEY,
                name        varchar(255) NOT NULL,
                parent_id   uuid REFERENCES folders(id) ON DELETE CASCADE,
                created_by  uuid REFERENCES users(id) ON DELETE SET NULL,
                sort_order  int NOT NULL DEFAULT 0,
                created_at  timestamptz NOT NULL DEFAULT now(),
                UNIQUE (parent_id, name)
              );
              CREATE INDEX idx_pages_folder_id ON pages (folder_id);
              ALTER TABLE pages ADD CONSTRAINT fk_pages_folder FOREIGN KEY (folder_id) REFERENCES folders(id);

              -- attachments
              CREATE TABLE attachments (
                id              uuid DEFAULT gen_random_uuid() PRIMARY KEY,
                original_name   varchar(500) NOT NULL,
                stored_name     varchar(500) NOT NULL UNIQUE,
                content_type    varchar(255) NOT NULL,
                size_bytes      bigint NOT NULL,
                uploaded_by     uuid REFERENCES users(id),
                page_id         uuid REFERENCES pages(id),
                created_at      timestamptz NOT NULL DEFAULT now()
              );
              CREATE INDEX idx_attachments_uploaded_by ON attachments (uploaded_by);
              CREATE INDEX idx_attachments_page_id ON attachments (page_id);

              -- embedding_runtime_settings
              CREATE TABLE embedding_runtime_settings (
                id              uuid DEFAULT gen_random_uuid() PRIMARY KEY,
                singleton_key   varchar(64) NOT NULL UNIQUE,
                provider        varchar(32) NOT NULL CHECK (provider IN ('openai', 'ollama', 'lmstudio')),
                model           varchar(255) NOT NULL,
                base_url        varchar(1024),
                api_key         varchar(2048),
                created_at      timestamptz NOT NULL DEFAULT now(),
                updated_at      timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - sql:
            sql: >
              DROP TABLE IF EXISTS embedding_runtime_settings, attachments, folders,
                api_keys, page_chunks, links, page_tags, tags, pages, users CASCADE;
              DROP EXTENSION IF EXISTS vector;
