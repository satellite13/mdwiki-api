databaseChangeLog:
  - changeSet:
      id: 006-create-api-keys
      author: mdwiki
      changes:
        - createTable:
            tableName: api_keys
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_api_keys_user
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: key_hash
                  type: varchar(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: last_used_at
                  type: timestamp with time zone
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamp with time zone
        - createIndex:
            indexName: idx_api_keys_key_hash
            tableName: api_keys
            columns:
              - column:
                  name: key_hash
        - createIndex:
            indexName: idx_api_keys_user_id
            tableName: api_keys
            columns:
              - column:
                  name: user_id
