databaseChangeLog:
  - changeSet:
      id: 003-create-tags
      author: mdwiki
      changes:
        - createTable:
            tableName: tags
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(200)
                  constraints:
                    nullable: false
                    unique: true
        - createTable:
            tableName: page_tags
            columns:
              - column:
                  name: page_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_page_tags_page
                    references: pages(id)
                    deleteCascade: true
              - column:
                  name: tag_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_page_tags_tag
                    references: tags(id)
                    deleteCascade: true
        - addPrimaryKey:
            tableName: page_tags
            columnNames: page_id, tag_id
