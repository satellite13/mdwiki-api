databaseChangeLog:
  - changeSet:
      id: 007-create-folders
      author: mdwiki
      changes:
        - createTable:
            tableName: folders
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: parent_id
                  type: uuid
                  constraints:
                    foreignKeyName: fk_folders_parent
                    references: folders(id)
                    deleteCascade: true
              - column:
                  name: created_by
                  type: uuid
                  constraints:
                    foreignKeyName: fk_folders_created_by
                    references: users(id)
              - column:
                  name: sort_order
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: folders
            columnNames: parent_id, name
            constraintName: uq_folders_parent_name
        - addColumn:
            tableName: pages
            columns:
              - column:
                  name: folder_id
                  type: uuid
                  constraints:
                    foreignKeyName: fk_pages_folder
                    references: folders(id)
        - createIndex:
            indexName: idx_pages_folder_id
            tableName: pages
            columns:
              - column:
                  name: folder_id
