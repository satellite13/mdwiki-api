databaseChangeLog:
  - changeSet:
      id: 005-create-page-chunks
      author: mdwiki
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS vector;
        - createTable:
            tableName: page_chunks
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: page_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_page_chunks_page
                    references: pages(id)
                    deleteCascade: true
              - column:
                  name: chunk_index
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: chunk_text
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: section_heading
                  type: varchar(500)
        - sql:
            sql: >
              ALTER TABLE page_chunks ADD COLUMN embedding vector;
        - createIndex:
            indexName: idx_page_chunks_page_id
            tableName: page_chunks
            columns:
              - column:
                  name: page_id
