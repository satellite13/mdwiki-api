databaseChangeLog:
  - changeSet:
      id: 013-create-attachments
      author: mdwiki
      changes:
        - createTable:
            tableName: attachments
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: original_name
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: stored_name
                  type: varchar(500)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: content_type
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: size_bytes
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: uploaded_by
                  type: uuid
                  constraints:
                    foreignKeyName: fk_attachments_uploaded_by
                    references: users(id)
              - column:
                  name: page_id
                  type: uuid
                  constraints:
                    foreignKeyName: fk_attachments_page
                    references: pages(id)
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_attachments_uploaded_by
            tableName: attachments
            columns:
              - column:
                  name: uploaded_by
        - createIndex:
            indexName: idx_attachments_page_id
            tableName: attachments
            columns:
              - column:
                  name: page_id
