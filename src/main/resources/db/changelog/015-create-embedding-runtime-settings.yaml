databaseChangeLog:
  - changeSet:
      id: 015-create-embedding-runtime-settings
      author: mdwiki
      changes:
        - createTable:
            tableName: embedding_runtime_settings
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: singleton_key
                  type: varchar(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: provider
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: model
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - sql:
            sql: |
              ALTER TABLE embedding_runtime_settings
              ADD CONSTRAINT ck_embedding_runtime_settings_provider
              CHECK (provider IN ('openai', 'ollama', 'lmstudio'));
