databaseChangeLog:
  - changeSet:
      id: 014-resize-page-chunks-embedding
      author: mdwiki
      validCheckSum: '1:any'
      # Пересоздаём колонку embedding под текущий embeddingDim. Размерность
      # задаётся Liquibase-параметром (EMBEDDING_DIMENSION). Если размерность
      # провайдера изменилась (например, переключились с OpenAI 1536 на
      # LM Studio / nomic / bge-m3 с 768/1024), старые векторы нечитабельны:
      # безопаснее удалить все чанки и дать RAG переиндексировать страницы
      # (см. reindex endpoint в SyncService). Исторические тексты остаются
      # в pages.content_md, так что потерь контента нет.
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: page_chunks
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DROP INDEX IF EXISTS idx_page_chunks_embedding;
              TRUNCATE TABLE page_chunks;
              ALTER TABLE page_chunks DROP COLUMN IF EXISTS embedding;
              ALTER TABLE page_chunks ADD COLUMN embedding vector(${embeddingDim});
              CREATE INDEX IF NOT EXISTS idx_page_chunks_embedding
                ON page_chunks USING hnsw (embedding vector_cosine_ops);
