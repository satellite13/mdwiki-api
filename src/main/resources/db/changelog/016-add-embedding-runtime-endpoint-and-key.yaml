databaseChangeLog:
  - changeSet:
      id: 016-add-embedding-runtime-endpoint-and-key
      author: mdwiki
      changes:
        - addColumn:
            tableName: embedding_runtime_settings
            columns:
              - column:
                  name: base_url
                  type: varchar(1024)
                  constraints:
                    nullable: true
              - column:
                  name: api_key
                  type: varchar(2048)
                  constraints:
                    nullable: true
