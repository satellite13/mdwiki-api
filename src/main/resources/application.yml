logging:
  level:
    org.springframework.context.support.PostProcessorRegistrationDelegate: ERROR
    "org.springframework.context.support.PostProcessorRegistrationDelegate$BeanPostProcessorChecker": ERROR
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: ERROR
    org.springframework.ai.mcp.server.transport: ERROR

spring:
  datasource:
    url: jdbc:postgresql://localhost:54328/mdwiki
    username: mdwiki
    password: mdwiki
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Должно совпадать с mdwiki.embedding.dimension (HNSW / vector(n) в 005).
    parameters:
      embeddingDim: ${EMBEDDING_DIMENSION:1536}
  servlet:
    multipart:
      max-file-size: ${MDWIKI_UPLOAD_MAX_FILE_SIZE:20MB}
      max-request-size: ${MDWIKI_UPLOAD_MAX_REQUEST_SIZE:25MB}
  ai:
    mcp:
      server:
        name: mdwiki-mcp
        type: SYNC
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp/sse

mdwiki:
  # Сколько строк стека писать в лог на одно исключение (logback LOG_EXCEPTION_CONVERSION_WORD)
  logging:
    stacktrace-max-lines: ${MDWIKI_LOG_STACKTRACE_LINES:16}
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-change-in-production-must-be-at-least-256-bits}
    expiration-ms: 86400000
  content-dir: ${MDWIKI_CONTENT_DIR:./wiki-content}
  # Размерность вектора в БД задаётся тем же EMBEDDING_DIMENSION (см. spring.liquibase.parameters).
  # Ollama nomic-embed-text → обычно 768; OpenAI text-embedding-3-small → 1536.
  embedding:
    provider: ${EMBEDDING_PROVIDER:openai}
    dimension: ${EMBEDDING_DIMENSION:1536}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      api-key: ${OPENAI_API_KEY:}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    lmstudio:
      base-url: ${LMSTUDIO_BASE_URL:http://localhost:1234/v1}
      model: ${LMSTUDIO_EMBEDDING_MODEL:nomic-ai/nomic-embed-text-v1.5}
      api-key: ${LMSTUDIO_API_KEY:}
  rag:
    max-chunk-chars: 2000
    vector-search-limit: 20
    reranker:
      model-path: ${MDWIKI_RERANKER_MODEL_PATH:}
