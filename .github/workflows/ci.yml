name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: mdwiki
          POSTGRES_USER: mdwiki
          POSTGRES_PASSWORD: mdwiki
        ports:
          - 54328:5432
        options: >-
          --health-cmd "pg_isready -U mdwiki -d mdwiki"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      JWT_SECRET: integration-test-jwt-secret-do-not-use-in-production
      DB_URL: jdbc:postgresql://localhost:54328/mdwiki
      DB_USERNAME: mdwiki
      DB_PASSWORD: mdwiki
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Test
        run: chmod +x gradlew && ./gradlew test --no-daemon
